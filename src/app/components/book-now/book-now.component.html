<section class="text-light py-5">
  <h2 class="text-center text-capitalize">book now</h2>
  <form action="" class="m-auto">
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
    </div>
    <div class="mb-3">
      <label for="Name" class="form-label">Name :</label>
      <input type="text" class="form-control" id="Name" placeholder="Name">
    </div>
    <div class="mb-3">
      <label for="How many people" class="form-label">How many people :</label>
      <input type="number" class="form-control" id="How many people" placeholder="How many people">
    </div>
    <div class="mb-3">
      <label for="Date" class="form-label">Date :</label>
      <input type="datetime-local" class="form-control" id="Date" placeholder="Date">
    </div>
    <div class="mb-3">
      <label for="Message" class="form-label">Message :</label>
      <textarea class="form-control" id="Message" rows="3"></textarea>
    </div>
    <button class="btn">Book</button>
  </form>
</section>
